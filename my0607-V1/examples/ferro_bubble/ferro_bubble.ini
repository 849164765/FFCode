[parallel]
thread_num = 4

[Mesh]
Ni = 256
Nj = 512
Cell_Len = 1.0
BlockCellLen = 16

[Bubble]
Radius = 50
CenterX = 128.0
CenterY = 64.0

[Two_Phase]
rho_l = 1.0               ; light fluid density
rho_h = 2.0               ; heavy fluid density
eta_l = 0.1               ; light fluid viscosity
eta_h = 0.1               ; heavy fluid viscosity
mu_l  = 1.0               ; light fluid permeability
mu_h  = 2.0               ; heavy fluid permeability
mu0   = 1.0               ; vacuum permeability (lattice units)
Eo    = 10                 ; Eotvos number (10/50/100/200)
Re    = 50                 ; Reynolds number
g     = -9.8e-6            ; gravitational acceleration (lattice units)

[Phase_Field]
Interface_Width = 3.0      ; interface width (lattice units)
Mobility = 0.1             ; mobility M_phi
sigma = 0.01               ; surface tension

[Simulation_Settings]
TotalStep = 50000
OutputStep = 1000
TestCase = ferro_bubble     ; bubble rise with magnetic field
