[parallel]            ; parallel settings
thread_num = 4       ; number of threads

[Mesh]
Nx = 100
Ny = 100
Nz = 100
Cell_Len = 1.0
BlockCellLen = 16

[Droplet]
Radius = 0.15         ; 无量纲半径
CenterX = 0.5
CenterY = 0.75
CenterZ = 0.5
VelocityX = 0.0
VelocityY = 0.0
VelocityZ = 0.0

[Phase_Field]
Interface_Width = 3.0    ; 界面宽度 ξ（格子数）
Mobility = 0.001         ; 迁移率 M
Sigma = 0.072            ; 表面张力 σ

[Simulation_Settings]
TotalStep = 1000
OutputStep = 10
U0 = 0.01                  ; 特征速度
TestCase = vortex           ; "slotted_sphere" 或 "vortex" 或 "deformation" 或 "shear"

[SlottedSphere]
SlotWidth = 0.1             ; 槽口 x 方向宽度（无量纲）
SlotHeight = 0.2            ; 槽口 y 方向高度（无量纲）
Tf = 1                      ; 无量纲终态时间

[Vortex]
Tf = 2                      ; 无量纲终态时间

[Deformation]
Tf = 1                      ; 无量纲终态时间

[Shear]
Tf = 2                      ; 无量纲终态时间
