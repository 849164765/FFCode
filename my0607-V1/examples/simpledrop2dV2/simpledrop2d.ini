[parallel]            ; parallel settings
thread_num = 4       ; number of threads

[Mesh]
Ni = 250
Nj = 250
Cell_Len = 1.0
BlockCellLen = 10

[Droplet]
Radius = 50
CenterX = 125.0
CenterY = 125.0
VelocityX = 0.0
VelocityY = 0.0

[Phase_Field]
Interface_Width = 4.0    ; 界面宽度（格子数）
Mobility = 0.01          ; 迁移率 M

[Simulation_Settings]
TotalStep = 10000
OutputStep = 100
TestCase = vortex         ; "taylor_green" 或 "zalesak" 或 "vortex"

[Zalesak]
U0 = 0.04                  ; 旋转特征速度
SlotWidth = 6.0             ; 槽口宽度（格子单位）

[Vortex]
U0 = 0.02                  ; 特征速度
n = 4                       ; 涡数量控制参数（单模 reversing vortex）
T = 10000                    ; 时间周期（格子步数）
