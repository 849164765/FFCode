# bubble_paper2d.ini — Bubble rising with VTK output
# Parameters calibrated for numerical stability

[workdir]
workdir_ = ./

[parallel]
thread_num = 4

[Mesh]
Ni = 256
Nj = 512
Cell_Len = 1.0
BlockCellLen = 64

[Bubble]
Radius = 40
CenterX = 128
CenterY = 80

[Phase_Field]
Interface_Width = 4.0
Mobility = 0.1

[Two_Phase]
rho_l = 1.0
rho_h = 10.0
Eo = 100
Re = 100
U_g = 0.04

[Simulation_Settings]
TotalStep = 50000
OutputStep = 1000
