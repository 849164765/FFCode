[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; 计算域 [0,2L]x[0,2L], L=256, 界面居中 y=L=256
Ni = 512
Nj = 512
Cell_Len = 1.0
BlockCellLen = 64
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
; 密度比 rho_l/rho_h=0.99, 有机溶剂(轻)/铁磁流体(重)
rho_l = 0.99
rho_h = 1.0
Re = 5000
We = 10000
Fr = 1.0
U = 0.02
[Magnetic_Field]
chi_l = 0.0
chi_h = 1.0
mu_l = 1.0
mu_h = 2.0
; 论文 F 节取值: 0 / 636 / 1434 / 2547 / 3980
Bom = 636
; 每流体步磁势 MRT 伪时间子迭代次数。
; 用户校准确认: PsiSolver_Iter=100 + MagPressure_Factor=1.5 时图像与文献基本对齐。
PsiSolver_Iter = 100
[Simulation_Settings]
; 论文图像校准: t*_plot = KH_TSTAR_SCALE * t*_eq = k*step*sqrt(g/L)
; 用户对照 Fig.31 确认: Bom=0, step=25600 (旧代码自报 t*=6)
; 实际对应文献 t*=8 -> k = 8/(25600*7.8125e-5) = 4.0。
; (早期 step 8000~9000 看起来像 t*=2 是旧相位+卷曲形状混淆所致;
;  现已把界面相位修正为文献式 y=L-0.1L*cos(2πx/L)。)
; L=256, U=0.02 -> sqrt(g/L)=7.8125e-5, t*_plot = k*step/12800
; k=4.0: t*=2 约 step=6400, t*=4 约 step=12800, t*=6 约 step=19200, t*=8 约 step=25600
KH_TSTAR_SCALE = 4.0
; KH 专用磁压力项 F_p=-0.5*Hx^2*grad(mu) (仅 KH 案例内启用, src Kelvin 力不动)
; 0=关闭(只保留 src Kelvin 力, 即旧 kh2dStd 行为), 1=开启(与 khMag3d 一致)
MagPressure = 1
; 磁压力项拟合系数 (用户校准确认 1.5 与文献 Fig.32-34 对齐)
MagPressure_Factor = 1.5
; 壁面 16 格处磁力伪尖峰过滤 (0=关闭, 恢复旧行为; 左右缝 H ghost 现由
; SyncMFPeriodicGhosts 正确处理, 不再跳过缝列)
MagForce_Filter = 1
TotalStep = 30000
OutputStep = 1000
