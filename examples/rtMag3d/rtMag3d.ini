[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; L=128 -> 域 128x128x512 = 4L (论文 E 节 2D 为 L x 4L, L=256; 3D 取 L=128 以便计算)
; 网格必须能被 BlockCellLen 整除 (每方向块数 = 网格/块长)
Ni = 128
Nj = 128
Nk = 512
Cell_Len = 1.0
BlockCellLen = 32
[Interface]
; 初始界面 z0 = 2L, 扰动 h(x) = z0 + A*cos(2pi x/L) (2D 脊状, 与 y 无关, 论文原始设置)
; 论文 E 节: y = 2L + 0.1L*cos(2pi x/L) -> A = 0.1L = 12.8
; (之前 3D 方模态 cos·cos 会产生柱状尖钉的环形涡卷, 导致"中段凸出", 已改回 2D 脊状)
Z0_cells = 256
PerturbAmp_cells = 12.8
PerturbPeriods = 1
[Phase_Field]
; 界面厚度 W=5 格 (论文 E 节)
Interface_Width = 5
Mobility = 0.01
[Two_Phase]
; 论文 E 节无量纲数 (重铁磁流体在上, 轻溶剂在下):
;   At=0.5, Re=256, Ca=1, U0=sqrt(gL)=0.01, rho_l=1.0
; 推导: rho_h=rho_l*(1+At)/(1-At), g=U0^2/L, eta_l=rho_l*U0*L/Re, sigma=eta_l*U0/Ca
At = 0.5
Re = 256
Ca = 1
U0 = 0.01
rho_l = 1.0
; eta_h 未由无量纲数约束 (经典 RT 基准取 eta_h=eta_l); 铁磁流体可设更大
eta_h = 0.005
; 界面预压力项 F_p = -(p/3)*DeltaRho*grad(phi) (Zu&He 格式, 默认开启)
PreForce = 1
; 显式覆盖 (可选): 给出则优先于无量纲推导
; rho_h = 3.0
; eta_l = 0.005
; sigma = 5e-5
; Gravity = 7.8125e-7
[Magnetic_Field]
; 铁磁流体 (重流体, 在上): chi_h -> mu_h = 1+chi_h, 轻溶剂 chi_l=0
chi_l = 0.0
chi_h = 0.9
mu_l = 1.0
mu_h = 1.9
; 磁 Bond 数 Bo_m = mu0*H0^2*L/(2*sigma) (mu0=1), H0 = sqrt(2*sigma*Bo_m/L)
; 论文 E 节取值: 0 / 2.57 / 16.08 / 41.18 / 64.34
Bo_m = 41.18
; 显式 H0 覆盖 (可选): 给出则优先
; H0 = 0.005672
; psi-solver: K=0.5 -> tau=0.5+0.5*mu, 100 次子迭代收敛 (消除界面 |H| 网格级振荡)
PsiSolver_Iter = 100
PsiSolver_K = 0.5
[Simulation_Settings]
TotalStep = 40000
OutputStep = 8000
