; ============================================================
; FreeLB Rayleigh-Taylor 不稳定性 2D 铁磁流体算例
; 计算域 [0,L] x [0,4L], L=256 (论文行928/934)
; ============================================================
[workdir]
workdir_ = ./
[parallel]
thread_num = 1
; --- 网格参数 ---
; Ni: x 方向格子数 = L (论文行934 L=256)
; Nj: y 方向格子数 = 4L (论文行928 域[0,L]x[0,4L])
[Mesh]
Ni = 256
Nj = 1024
Cell_Len = 1.0
BlockCellLen = 64
; --- Rayleigh-Taylor 参数 ---
; L: 特征长度 (论文行934)
; sqrt_gL: sqrt(g*L)=0.01 (论文行962), 参考速度 U0=sqrt(gL)=0.01 (论文行960)
; At: Atwood数 (论文式73, 行962)
; Re: Reynolds数 (论文式73后, 行962), 可改为3000(论文行972)
; Ca: Capillary数 (论文式74, 行962)
; W: 界面厚度跨5个网格 (论文行962)
; ViscRatio: 重相/轻相动力粘度比
;   论文: 运动粘度ν相同 → η_h/η_l = ρ_h/ρ_l = (1+At)/(1-At) = 3
[RT_Params]
L = 256
sqrt_gL = 0.01
At = 0.5
Re = 256
Ca = 1.0
W = 5
ViscRatio = 3
; --- 相场参数 ---
; Mobility: 相场迁移率 M_phi (论文式22, 用户确认取0.01)
; Interface_Width: 界面厚度 W (论文行962, 等于RT_Params.W)
[Phase_Field]
Mobility = 0.01
Interface_Width = 5.0
; --- 两相流参数 ---
; rho_l: 轻相密度 (论文行962)
; rho_h 由 At 反解(式73): rho_h = rho_l*(1+At)/(1-At) = 3.0
[Two_Phase]
rho_l = 1.0
; --- 磁场参数 ---
; chi_l: 轻相磁化率 (用户确认, 非磁介质)
; chi_h: 重相磁化率 (用户确认, 铁磁流体, 同bubble)
; mu_l: 轻相磁导率 mu=mu0*(1+chi), mu0=1 (用户确认)
; mu_h: 重相磁导率 (用户确认, 同bubble)
; Bom: 磁Bond数 (论文式76, 行977), 可改为0/2.57/16.08/41.18/64.34 (论文行977)
; PsiSolver_K: 当前 SOR 不使用, 仅为兼容 mfield2d 字段
; MF_SOR_Iter: SOR求解器迭代次数(每次包含红+黑两pass)
;   50次足够局部收敛, 界面变形大时可增至100
;   实测 10 次时 H_heavy/H_light 会从 0.5 漂到 0.7+, 磁力被削弱; 用 50~80
; MF_SOR_Omega: SOR松弛因子(1.0=Jacobi, 1.5-1.9=SOR最优)
;   64x64块最优ω≈1.9, 用1.8保证稳定
[Magnetic_Field]
chi_l = 0.0
chi_h = 1.0
mu_l = 1.0
mu_h = 2.0
; 论文 E 节取值: 0 / 2.57 / 16.08 / 41.18 / 64.34
Bom = 0
PsiSolver_K = 0.5
MF_SubSteps = 1
; MF_Fscale: 磁力放大系数, 1.0=论文Eq.(8)原始强度
;   调大(如2/4/8)用于复现文献 t*=0.5 已明显的磁效应, 校准后应回到1.0
MF_Fscale = 1.0
MF_SOR_Iter = 100
MF_SOR_Omega = 1.8
; --- 仿真设置 ---
; TotalStep: 80000步→论文t*≈3.1 (论文Eq.84: t*=t*sqrt(g/L), 1对应25600步)
; 论文Fig.27展示t*=0,0.5,1,1.5,2,3,4 等；需要哪个时刻按 25600*t* 换算步数
; OutputStep: 每2000步输出 (约每t*_paper=0.078输出一次)
[Simulation_Settings]
TotalStep = 51200
OutputStep = 12800
