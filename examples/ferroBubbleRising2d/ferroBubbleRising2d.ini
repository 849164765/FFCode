[workdir]
workdir_ = ./
[parallel]
thread_num = 8
[Mesh]
Ni = 256
Nj = 512
Cell_Len = 1.0
BlockCellLen = 64
[Bubble]
Diameter = 100
CenterX = 128.0
CenterY = 128.0
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.1
[Two_Phase]
; Guo et al. (2025) Case C: ρ_h/ρ_l=1000, η_h/η_l=100, Re=40, Eo=20
rho_l = 1.0
rho_h = 1000.0
Eo = 20.0
Re = 40.0
[Magnetic]
; === Guo et al. (2025) Case C ===
; μ_l=μ₀=1 (bubble, non-magnetic)
; μ_h=μ₀(1+χ_h)=3.2 (ferrofluid)
; χ linearly interpolated from φ
Mu_l = 1.0
Mu_h = 3.2
Chi_l = 0.0
Chi_h = 2.2
; H₀: uniform vertical field — 对应 Bom = μ₀H₀²D/(2σ) (Eq.65, μ₀=1)
;   Bom    | H₀_LB   | 现象 (论文 Fig.16)
;   -------|---------|-----------------------------
;   0      | 0.0     | 无磁场, 水平延展
;   0.13   | 0.0481  | 微弱垂直拉伸
;   0.27   | 0.0693  | 垂直拉伸
;   0.49   | 0.0933  | 明显拉长
;   0.76   | 0.1162  | 显著拉长, 尾丝形成
;   1.94   | 0.1857  | 长丝状, 可能分裂
H0 = 0.1162
[Simulation_Settings]
TotalStep = 50000
OutputStep = 1000
