[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 128
Nj = 128
Nk = 256
Cell_Len = 1.0
BlockCellLen = 64
[Bubble]
Radius = 25
CenterX = 64
CenterY = 64
CenterZ = 64
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
rho_l = 0.001
rho_h = 1.0
; 格子粘度: D=50 时建议 eta_h<=0.03 (Ma_base=U_c/cs<0.07 才稳定)
; 本配置 eta_h=0.017 -> Ma_base=0.024 安全
eta_l = 0.00017
eta_h = 0.017
Eo = 20
Re = 40
U_g = 0.0136
[Magnetic_Field]
chi_l = 0.0
chi_h = 8.0
mu_l = 1.0
mu_h = 9.0
Bom = 1.94
; psi-solver: K=0.5 -> tau=0.5+0.5*mu (omega_mu9=0.2, omega_mu1=1.0), ~100 sub-iterations
PsiSolver_Iter = 100
PsiSolver_K = 0.5
; R=25 (D=50, eta_h=0.017): g=3.70e-6, t* = t*2.720e-4  ->  t*=1 在 3676 步
; TotalStep=4500 跑到 t*≈1.22; 如需恰好 t*=1 可设 TotalStep=3676
[Simulation_Settings]
TotalStep = 4500
OutputStep = 500
