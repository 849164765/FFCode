[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 256
Nj = 256
Nk = 512
Cell_Len = 1.0
BlockCellLen = 64
[Bubble]
Radius = 50
CenterX = 128
CenterY = 128
CenterZ = 128
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
rho_l = 0.001
rho_h = 1.0
; 格子粘度: 默认 0.0568/100, 0.0568 (2D生产版同值, D=100时 Ma_base=0.04 安全)
; 注意: U_c = Re*eta_h/(rho_h*D), Ma_base = U_c/cs 必须 < ~0.07 才稳定!
;   D=100: 0.0568 OK;  D=50: 建议 eta_h<=0.03;  D=32: <=0.02;  D=24: <=0.017
eta_l = 0.000568
eta_h = 0.0568
Eo = 20
Re = 40
U_g = 0.0227
[Magnetic_Field]
chi_l = 0.0
chi_h = 8.0
mu_l = 1.0
mu_h = 9.0
Bom = 1.94
; psi-solver: K=0.5 -> tau=0.5+0.5*mu (omega_mu9=0.2, omega_mu1=1.0), ~100 sub-iterations
PsiSolver_Iter = 100
PsiSolver_K = 0.5
; R=50 (D=100): t* = t*sqrt(g/D) = 2.272e-4 * t  ->  t*=1 在 4401 步
; TotalStep=4500 跑到 t*≈1.02 (与 2D 生产版 4500 步完全一致)
[Simulation_Settings]
TotalStep = 4500
OutputStep = 500
