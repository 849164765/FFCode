[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 256
Nj = 256
Nk = 512
Cell_Len = 1.0
BlockCellLen = 64
[Bubble]
Radius = 50
CenterX = 128
CenterY = 128
CenterZ = 128
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
rho_l = 0.001
rho_h = 1.0
; 格子粘度: 无eta覆盖=代码默认 0.0568/100, 0.0568
; D=100 时 Ma_base = Re*eta_h/(rho_h*D*cs) = 0.039 安全 (<0.07)
Eo = 20
Re = 40
U_g = 0.0227
[Magnetic_Field]
chi_l = 0.0
chi_h = 8.0
mu_l = 1.0
mu_h = 9.0
Bom = 1.94
; psi-solver: K=0.5 -> tau=0.5+0.5*mu (omega_mu9=0.2, omega_mu1=1.0), ~100 sub-iterations
PsiSolver_Iter = 100
PsiSolver_K = 0.5
; R=50 (D=100): g=5.16e-6, t* = t*2.272e-4  ->  t*=1 在 4401 步
; TotalStep=5000 跑到 t*≈1.14
[Simulation_Settings]
TotalStep = 5000
OutputStep = 100
