[parallel]
thread_num = 4

[Mesh]
Ni = 400
Nj = 1000
Cell_Len = 1.0
BlockCellLen = 50

[Bubble1]
Radius = 30               ; upper bubble radius
CenterX = 200.0
CenterY = 650.0           ; upper bubble center

[Bubble2]
Radius = 30               ; lower bubble radius
CenterX = 200.0
CenterY = 550.0           ; lower bubble center: gap=650-30-(550+30)=40 lu

[Phase_Field]
Interface_Width = 4.0
Mobility = 0.1

[Two_Phase]
rho_l = 1.0               ; light fluid density (bubble)
rho_h = 1.8               ; heavy fluid density (liquid)
Eo = 10.0                 ; Eotvos number = DeltaRho*g*D^2/sigma
Re = 10.0                 ; Reynolds number = U_g*D/nu
U_g = 0.04                ; characteristic velocity

[Simulation_Settings]
TotalStep = 100000
OutputStep = 1000
