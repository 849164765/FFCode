[parallel]             ; parallel settings
thread_num = 4          ; number of OpenMP threads

[Mesh]
Ni = 200                ; grid points in x (periodic)
Nj = 200                ; grid points in y (wall bounded)
Cell_Len = 1.0          ; cell size (lattice units)
BlockCellLen = 40       ; block partition size

[Droplet]
Radius = 30             ; initial droplet radius (lattice units)
CenterX = 100.0         ; initial droplet center x
CenterY = 100.0         ; initial droplet center y

[Shear_Flow]
Wall_Velocity = 0.03    ; U_wall, velocity magnitude at walls

[Fluid]
rho = 1.0               ; fluid density (both phases, Boussinesq)
nu = 0.1                ; kinematic viscosity (lattice units)
Viscosity_Ratio = 1.0   ; eta_droplet / eta_continuous

[Phase_Field]
Interface_Width = 4.0   ; interface width W (lattice units)
Surface_Tension = 0.005 ; surface tension sigma
Mobility = 0.01         ; Cahn-Hilliard mobility M

[Simulation_Settings]
TotalStep = 200000      ; total simulation steps
OutputStep = 10        ; output frequency
