[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; L=64 -> 域 x∈[0,2L]=128, y∈[0,L]=64, z∈[0,4L]=256 (论文 F 节 2D 为 [0,2L]x[0,4L])
; x/y 周期, z 壁; 网格必须能被 BlockCellLen 整除
Ni = 128
Nj = 64
Nk = 256
Cell_Len = 1.0
BlockCellLen = 32
[Interface]
; 界面 z0 = 2L, 扰动只沿 x: h(x) = z0 + A*cos(2πx/L), A=0.1L=6.4, 2 个周期跨域宽
Z0_cells = 128
PerturbAmp_cells = 6.4
PerturbPeriods = 2
[Phase_Field]
; 界面厚度 W (论文 F 节; 代码 λ=64, W 太大 (5/64=0.078) 会抹平表面集中的磁力,
; 论文 W/λ≈0.016; W=4 为论文值, 兼顾稳定与表面力分辨)
Interface_Width = 4
Mobility = 0.01
[Two_Phase]
; 论文 F 节无量纲 (溶剂在 φ=0 侧, Re/We/Fr 用溶剂密度/粘度):
;   U0=0.02, Re=5000(对照 500/50000), We=10000, Fr=1, rho_l(solvent)=1.0
;   rho_hl_ratio = rho_ferro/rho_solvent = 0.99 (铁磁流体略轻, 在 φ=1 侧)
Re = 5000
We = 10000
Fr = 1
U0 = 0.02
rho_l = 1.0
rho_hl_ratio = 0.99
; 铁磁流体粘度 (φ=1 侧), 未由无量纲数约束; 取 eta_h=0.004 (粘度比 ~15 的意图)。
; 注: 溶剂低粘度 (Re=5000 -> eta_l=2.56e-4) 受 omega 上限 (1.99, src/ff/ff3d.hh) 钳制,
;     实际溶剂 nu~8.35e-4 -> 有效 Re~1533、粘度比~4.8; 如需严格 Re=5000 需再把上限提到 ~1.997。
eta_h = 0.004
; 界面预压力项 F_p = -(p/3)*DeltaRho*grad(phi) (默认开启)
PreForce = 1
; 显式覆盖 (可选): 给出则优先于无量纲推导
; rho_h = 0.99
; eta_l = 0.000256
; sigma = 2.56e-6
; Gravity = 6.25e-6
[Magnetic_Field]
; 铁磁流体(φ=1, 在下): chi_h -> mu_h = 1+chi_h; 溶剂(φ=0) chi_l=0
chi_l = 0.0
chi_h = 0.9
mu_l = 1.0
mu_h = 1.9
; 磁 Bond 数 Bo_m = mu0*H0^2*L/(2*sigma) (mu0=1), H0 = sqrt(2*sigma*Bo_m/L)
; 论文 F 节取值: 0 / 636 / 1434 / 2547 / 3980
Bo_m = 2547
; 显式 H0 覆盖 (可选): 给出则优先
; H0 = 0.01427
; psi-solver: K=0.5 -> tau=0.5+0.5*mu, 100 次子迭代收敛 (消除界面 |H| 网格级振荡)
PsiSolver_Iter = 100
PsiSolver_K = 0.5
[Simulation_Settings]
; 无量纲时间 t* = t*sqrt(g/L) = t*U0/L = t/3200 (L=L_ref=64, U0=0.02)
; 论文 F 节 t*=0,2,4,6,8 -> step 0, 6400, 12800, 19200, 25600
TotalStep = 25600
OutputStep = 1000
