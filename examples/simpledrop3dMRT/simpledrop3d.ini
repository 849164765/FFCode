[parallel]            ; parallel settings
thread_num = 4       ; number of threads

[Mesh]
Nx = 100
Ny = 100
Nz = 100
Cell_Len = 1.0
BlockCellLen = 16

[Droplet]
Radius = 15              ; 液滴半径（格子单位）
CenterX = 50.0           ; 液滴中心 x（格子单位）
CenterY = 50.0           ; 液滴中心 y（格子单位）
CenterZ = 50.0           ; 液滴中心 z（格子单位）
VelocityX = 0.0
VelocityY = 0.0
VelocityZ = 0.0

[Phase_Field]
Interface_Width = 3.0    ; 界面宽度 ξ（格子数）
Mobility = 0.001         ; 迁移率 M
Sigma = 0.072            ; 表面张力 σ

[Simulation_Settings]
OutputStep = 10
TestCase = vortex           ; "slotted_sphere" 或 "vortex" 或 "deformation" 或 "shear"

[SlottedSphere]
U0 = 0.01                  ; 特征速度
SlotWidth = 6.0             ; 槽口宽度（格子单位）
SlotHeight = 12.0           ; 槽口高度（格子单位）

[Vortex]
U0 = 0.01                  ; 特征速度
T = 10000                   ; 半周期 T（格子步数），完整周期 = 2T
Tf = 2                      ; 半周期数（Tf=2 表示运行一个完整周期 2T）

[Deformation]
U0 = 0.01                  ; 特征速度
T = 10000                   ; 半周期 T（格子步数）
Tf = 2                      ; 半周期数

[Shear]
U0 = 0.01                  ; 特征速度
T = 10000                   ; 半周期 T（格子步数）
Tf = 2                      ; 半周期数
