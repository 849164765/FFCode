[workdir]
workdir_ = ./
[parallel]
thread_num = 8
[Mesh]
Ni = 200
Nj = 200
Cell_Len = 1.0
BlockCellLen = 100
[Droplet]
Radius = 12.5
CenterX = 100.0
CenterY = 100.0
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.1
[Two_Phase]
; Hu & Li (2018) Case B — lattice units
; ρ_ref=800 kg/m³, L_ref=0.8 mm, U_ref=5 m/s
rho_l = 1.0
rho_h = 1.975
; Below: unused by code (hardcoded Hu2018), kept for reference only
Eo = 0.0
Re = 0.0
U_g = 0.0
[Magnetic]
; === 无量纲化 (Hu & Li 2018, Phys. Rev. E 98, 033301 §B) ===
; χ: 线性磁化 (H ≪ Ms=40 kA/m), χ ≈ χ₀ = 2.2
Mu_l = 1.0
Mu_h = 3.2
Chi_l = 0.0
Chi_h = 2.2
; H₀: 均匀垂直外磁场 — 对应论文 Fig.4 五种工况:
;   H_phys(kA/m) | Bom_est | H₀_LB    | 现象
;   -------------|---------|----------|--------------------
;   1.2          | ~0.9    | 0.010    | 近圆形
;   2.4          | ~3.6    | 0.021    | 微椭圆
;   2.9          | ~5.2    | 0.025    | 椭圆
;   3.7          | ~8.5    | 0.032    | 明显拉长
;   5.5          | ~18.8   | 0.047    | 显著拉长
; Bom_est ≈ χ·H₀²·R/σ  (R=12.5, σ=0.00191875, χ=2.2)
H0 = 0.021
[Simulation_Settings]
TotalStep = 10000
OutputStep = 100
