[parallel]            ; parallel settings
thread_num = 4       ; number of OpenMP threads

[Mesh]
Ni = 128            ; grid points in x
Nj = 256            ; grid points in y
Cell_Len = 1.0       ; cell size (lattice units)
BlockCellLen = 32    ; block partition size

[Fluid]
Rho_Light = 0.95     ; density of lighter fluid (below), ρ₁
Rho_Heavy = 1.05     ; density of heavier fluid (above), ρ₂
                     ; Atwood number A = (ρ₂-ρ₁)/(ρ₂+ρ₁) = 0.05
Gravity = -0.0005     ; gravitational acceleration (negative = downward)
                     ; With Atwood A=0.05, σ=0.072, ρ₀=1.0:
                     ; k_c = sqrt(2Agρ₀/σ) ≈ 0.0833
                     ; k = 2π/256 ≈ 0.0245 < k_c → unstable, α ≈ 0.0024
Kinematic_Viscosity = 0.02  ; kinematic viscosity ν (lattice units)
                     ; τ = 0.5 + ν/cs², ω = 1/τ

[Phase_Field]
Interface_Width = 4.0     ; interface width W (lattice units)
Surface_Tension = 0.027   ; surface tension σ
Mobility = 0.01           ; Cahn-Hilliard mobility M
                          ; κ = 1.5*W*σ, β = 12*σ/W

[Perturbation]
Amplitude = 15.36   ; initial perturbation amplitude h₀
                    ; h₀/λ = 0.06 for λ = Nx (single mode)
WaveNumber = 1      ; mode number k (k_phys = 2πk/Lx)

[Simulation_Settings]
TotalStep = 30000  ; total simulation steps
OutputStep = 200   ; output frequency
