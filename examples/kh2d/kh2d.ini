[workdir]
workdir_ = ./

[parallel]
thread_num = 1

[Mesh]
; 计算域 [0,2L]x[0,2L], L=256 (文献 Sec.F 第1039行)
; 文献: 域为[0,2L]x[0,2L]=[0,512]x[0,512], L=256为半域
; 界面居中 y=L=256, 扰动波长=L=256 (文献 Eq.78: cos(2*pi*x/L))
Ni = 512
Nj = 512
Cell_Len = 1.0
BlockCellLen = 64

[Phase_Field]
; 界面厚度 W (文献KH案例未明确; bubbleMag2d取4, RT案例取5, 此处沿用4)
Interface_Width = 4.0
; 相场迁移率 M (文献 Sec.B/D 第562/873行 ferrodroplet/Rosensweig 取值)
Mobility = 0.01

[Two_Phase]
; 密度比 rho_l/rho_h=0.99 (文献 Sec.F 第1098行), 有机溶剂(轻)/铁磁流体(重)
rho_l = 0.99
; 铁磁流体密度 (LBM基准单位)
rho_h = 1.0
; 雷诺数 Re=5000 (文献 Sec.F 第1098行, Eq.81: Re=rho_h*U*L/eta_h)
Re = 5000
; Weber数 We=10000 (文献 Sec.F 第1098行, Eq.82: We=rho_h*L*U^2/sigma)
We = 10000
; Froude数 Fr=1.0 (文献 Sec.F 第1098行, Eq.83: Fr=U^2/(g*L))
Fr = 1.0
; 参考速度(剪切速度) U=0.02 (文献 Sec.F 第1098行)
U = 0.02

[Magnetic_Field]
; 有机相磁化率 chi_l=0 (非磁性, 用户确认沿用bubbleMag2d)
chi_l = 0.0
; 铁磁相磁化率 chi_h=1.0 (用户确认沿用bubbleMag2d)
chi_h = 1.0
; 有机相磁导率 mu_l=1+chi_l=1.0 (文献 Eq.3, Sec.A)
mu_l = 1.0
; 铁磁相磁导率 mu_h=1+chi_h=2.0 (文献 Eq.3, Sec.A)
mu_h = 2.0
; 磁Bond数 Bo_m=636 (文献 Sec.F 第1107行, Eq.84: Bo_m=mu0*H0^2*L/(2*sigma))
; 可选值: 0(无磁场), 636, 1434, 2547, 3980 (文献 Sec.F 第1107行)
Bom = 636

[Simulation_Settings]
; t* = n * sqrt(g/L), g=U^2/(Fr*L)=1.5625e-6, L=256
; t* = n * 7.8125e-5, 故 t*=6 对应 n≈76800 步
TotalStep = 80000
OutputStep = 2000
