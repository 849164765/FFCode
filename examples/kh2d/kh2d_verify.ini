[workdir]
workdir_ = ./

[parallel]
thread_num = 1

[Mesh]
; 256x256 本地验证 (L=128 半域, 与 kh0723 网格相同但使用正确L定义和Twisted BC)
Ni = 256
Nj = 256
Cell_Len = 1.0
BlockCellLen = 64

[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01

[Two_Phase]
rho_l = 0.99
rho_h = 1.0
Re = 5000
We = 10000
Fr = 1.0
U = 0.02

[Magnetic_Field]
chi_l = 0.0
chi_h = 1.0
mu_l = 1.0
mu_h = 2.0
Bom = 636

[Simulation_Settings]
; 20000 步以匹配云端步数, 验证不出现 t*=6 形态
TotalStep = 20000
OutputStep = 2000
