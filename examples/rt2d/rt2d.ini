; ============================================================
; FreeLB Rayleigh-Taylor 不稳定性 2D 铁磁流体算例
; 计算域 [0,L] x [0,4L], L=256 (论文行928/934)
; ============================================================
[workdir]
workdir_ = ./
[parallel]
thread_num = 1
; --- 网格参数 ---
; Ni: x 方向格子数 = L (论文行934 L=256)
; Nj: y 方向格子数 = 4L (论文行928 域[0,L]x[0,4L])
[Mesh]
Ni = 256
Nj = 1024
Cell_Len = 1.0
BlockCellLen = 64
; --- Rayleigh-Taylor 参数 ---
; L: 特征长度 (论文行934)
; sqrt_gL: sqrt(g*L)=0.01 (论文行962), 参考速度 U0=sqrt(gL)=0.01 (论文行960)
; At: Atwood数 (论文式73, 行962)
; Re: Reynolds数 (论文式73后, 行962), 可改为3000(论文行972)
; Ca: Capillary数 (论文式74, 行962)
; W: 界面厚度跨5个网格 (论文行962)
; ViscRatio: 重相/轻相动力粘度比 (用户确认, 同bubble)
[RT_Params]
L = 256
sqrt_gL = 0.01
At = 0.5
Re = 256
Ca = 1.0
W = 5
ViscRatio = 100
; --- 相场参数 ---
; Mobility: 相场迁移率 M_phi (论文式22, 用户确认取0.01)
; Interface_Width: 界面厚度 W (论文行962, 等于RT_Params.W)
[Phase_Field]
Mobility = 0.01
Interface_Width = 5.0
; --- 两相流参数 ---
; rho_l: 轻相密度 (论文行962)
; rho_h 由 At 反解(式73): rho_h = rho_l*(1+At)/(1-At) = 3.0
[Two_Phase]
rho_l = 1.0
; --- 磁场参数 ---
; chi_l: 轻相磁化率 (用户确认, 非磁介质)
; chi_h: 重相磁化率 (用户确认, 铁磁流体, 同bubble)
; mu_l: 轻相磁导率 mu=mu0*(1+chi), mu0=1 (用户确认)
; mu_h: 重相磁导率 (用户确认, 同bubble)
; Bom: 磁Bond数 (论文式76, 行977), 可改为0/2.57/16.08/64.34
[Magnetic_Field]
chi_l = 0.0
chi_h = 1.0
mu_l = 1.0
mu_h = 2.0
Bom = 41.18
; --- 仿真设置 ---
; TotalStep: 覆盖 t*≈0..2.2 (t*=1≈36203步, 论文式77)
; OutputStep: 每 2000 步输出一次
[Simulation_Settings]
TotalStep = 80000
OutputStep = 2000
