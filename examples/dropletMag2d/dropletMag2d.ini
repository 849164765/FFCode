[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; droplet deformation (paper Sec. III.B): droplet at the center of a square
; cavity, no gravity, uniform vertical magnetic field
Ni = 256
Nj = 256
Cell_Len = 1.0
BlockCellLen = 32
[Droplet]
Radius = 30
CenterX = 128
CenterY = 128
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071
[Physical]
; physical reference for the direct kA/m -> lattice conversion
Lx_mm = 21.0
Ly_mm = 7.0
sigma_mNm = 3.89
lambda_c_mm = 2.82
rho_l_phys = 800.0
eta_l_phys = 0.0008
[Magnetic_Field]
; solvent: chi_l=0, mu_l ; droplet: chi_h=1.2 (mu_r=2.2), mu scaled x0.1
chi_l = 0.0
chi_h = 1.2
mu_l = 0.1
mu_h = 0.22
; applied field strength (kA/m), paper Fig.8: 1.2, 2.4, 2.9, 3.7
H0_kAm = 2.9
Hc_kAm = 4.7
PsiSolver_Iter = 30
PsiSolver_K = 3.0
[Simulation_Settings]
TotalStep = 12000
OutputStep = 500
