[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 128
Nj = 128
Nk = 192
Cell_Len = 1.0
BlockCellLen = 32
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
; organic solvent (top, light) / ferrofluid (bottom, heavy) — Guo et al. 2025 Sec. III.D
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071
[Rosensweig]
; ferrofluid occupies bottom 1/3 of the domain height
Interface_Z = 64.0
; critical wavelength in cells -> gravity: g = sigma/deltaRho*(2*pi/LambdaC)^2
LambdaC = 25.0
; direct gravity override (lattice units); 0 = compute from LambdaC
Gravity = 0.0
; initial perturbation: amplitude (cells) and mode (hex|noise|xwave)
Perturb_Amp = 0.5
Perturb_Mode = hex
[Magnetic_Field]
chi_l = 0.0
chi_h = 1.2
mu_l = 1.0
mu_h = 2.2
; H0 (lattice units); Hc ~ 0.132 for these params.
; H0=0.15 (1.14*Hc) -> weak ripples; H0=0.20 (1.51*Hc) -> clear hexagonal peaks;
; H0=0.30 (2.3*Hc)  -> strong peaks, grows fast (may hit the top wall on a short run).
; Production default: 0.20 (moderate, peaks saturate without touching the walls).
H0 = 0.20
; psi-solver: K=0.5 -> tau=0.5+0.5*mu, sub-iterated diffusion solve.
; mu contrast here is 2.2 (small), so 50 sub-iterations keep the field smooth.
PsiSolver_Iter = 50
PsiSolver_K = 0.5
[Simulation_Settings]
; peak growth ~ e^{0.0023·t} at H0=0.17 (measured on a 48x48x96 proxy);
; on the 128x128x192 domain the hex pattern organizes over ~10^4 steps.
TotalStep = 20000
OutputStep = 500
