[parallel]
thread_num = 1

[Mesh]
; 21 mm x 7 mm, dx = 21/512 mm
Ni = 512
Nj = 171
Cell_Len = 1.0
BlockCellLen = 64

[Interface]
; Ferrofluid phi=1 below the interface, solvent phi=0 above it.
Y0_cells = 57.0
SeedAmplitude_cells = 0.5
SeedPeriods = 7.0

[Phase_Field]
InterfaceWidth = 3.0
Mobility = 0.01

[Two_Phase]
; Guo et al. Case D / Flament benchmark lattice parameters.
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071

[Physical]
Lx_mm = 21.0
Ly_mm = 7.0
sigma_mNm = 3.89
lambda_c_mm = 2.82

[Magnetic_Field]
; Relative permeability ratio mu_h/mu_l = 2.2.
chi_l = 0.0
chi_h = 1.2
mu_l = 0.1
mu_h = 0.22
H0_kAm = 8.2
Hc_kAm = 4.7
PsiSolverIter = 60
PsiSolverK = 3.0

[Numerics]
; Uniform-grid correction documented by the validated Rosen benchmark.
PressureCorrectionScale = 0.6
PhiFloor = 0.01
PhiCeiling = 0.999
PsiWallLayers = 3
; Magnetic body force is zero in the solid-wall buffer where the scalar
; potential boundary discretization has no fluid volume to represent.
MagneticForceWallBand = 12

[Simulation_Settings]
TotalStep = 20000
OutputStep = 1000
