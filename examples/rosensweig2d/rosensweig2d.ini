[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; domain 21mm x 7mm -> 512 x 171 (dx = 41.0 um)
Ni = 512
Nj = 171
Cell_Len = 1.0
BlockCellLen = 64
[Interface]
; ferrofluid occupies the bottom 1/3 (y < Y0), organic solvent the top 2/3
Y0 = 57
; seeded cos perturbation: amp in cells, integer # of periods across Lx
; lambda_seed = Lx/7 = 3.0 mm ~ lambda_c = 2.82 mm
PerturbAmp = 0.1
PerturbPeriods = 7
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
; lattice units, paper Sec. III.D (Flament experiment)
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.0292
sigma = 0.0071
; g derived from lambda_c = 2.82 mm: g = sigma/DeltaRho*(2*pi/lambda_c)^2
; lambda_c = 68.75 cells -> gravity = 6.08e-5 (lattice)
gravity = 6.08e-5
[Magnetic_Field]
; solvent: chi_l=0 ; ferrofluid: chi_h=1.2 (mu_r=2.2)
chi_l = 0.0
chi_h = 1.2
; mu scaled by x0.1 (mu_l=0.1, mu_h=0.22): ∇·(μ∇ψ)=0 is homogeneous in μ, so the
; steady-state ψ is unchanged while the D2Q5 relaxation is much faster
; (omega_psi: 0.14->0.86). The physical ratio mu_r = mu_h/mu_l = 2.2 is preserved.
mu_l = 0.1
mu_h = 0.22
; physical field strength (kA/m): edit this value per case, e.g. 0, 4.9, 8.2
; (optionally overridable via command line: rosensweig2d.exe rosensweig2d.ini <H0_kAm>)
H0_kAm = 8.2
Hc_kAm = 4.7
; psi-solver: K=3.0 (1/cs^2, tau=0.5+mu/cs^2) with the mu scaling gives omega
; near 1 -> ~30 sub-iterations converge; the fast relaxation keeps the
; non-equilibrium (and the seam |H| elevation that seeds boundary peaks) small.
PsiSolver_Iter = 30
PsiSolver_K = 3.0
[Simulation_Settings]
TotalStep = 5000
OutputStep = 100
