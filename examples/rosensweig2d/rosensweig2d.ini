[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
# Original resolution: 252×84 (3:1 aspect ratio, 7 wavelengths across Lx)
Ni = 252
Nj = 84
Cell_Len = 1.0
BlockCellLen = 28
[Rosensweig]
# y_interface = Interface_Y_Ratio * Ly   (heavy ferrofluid below, light organic above)
# Paper (Guo2025 Sec. III.D, line 860): ferrofluid occupies bottom 1/3, organic top 2/3
# → interface at 1/3 of height from bottom
Interface_Y_Ratio = 0.3333333
# Small cosine perturbation at the interface to seed the instability
Perturb_Amplitude = 0.5
# λ_c=2.82mm, Lx=21mm → 21/2.82=7.4 peaks expected. Seed 7 modes → 3.0mm/peak (1.06×λ_c)
Perturb_Modes = 7
[Phase_Field]
Interface_Width = 3.0
Mobility = 0.01
[Two_Phase]
# Guo2025 Case D lattice parameters (paper Sec. III.D)
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071
[Magnetic_Field]
# Susceptibility χ = μ_r − 1; relative permeability μ_r = 2.2 → χ_h = 1.2
chi_l = 0.0
chi_h = 1.2
# μ scaling: μ×0.1 to accelerate MF solver convergence (ω_psi: 0.141→0.862)
# Since ∇·(μ∇ψ)=0 is homogeneous in μ, scaling μ preserves the steady-state ψ
# solution while increasing the relaxation rate. Ratio μ_h/μ_l = 2.2 unchanged.
mu_l = 0.1
mu_h = 0.22
# Applied uniform vertical magnetic field (physical, kA/m)
# Critical H_c = 4.7 kA/m. Tests: 0 (flat), 4.9 (just above), 8.2 (decays), 12.0 (testing)
H0_phys_kAm = 8.2
[Physical]
# Physical reference values for Cowley-Rosensweig unit conversion
# λ_c = 2π√(σ/(g·Δρ))  →  g_lattice derived from σ_lattice & λ_c
# H_c (kA/m) → H0_lattice derived from Bo_m_c consistency
Lx_mm = 21.0
Ly_mm = 7.0
sigma_mNm = 3.89
Hc_kAm = 4.7
lambda_c_mm = 2.82
[Simulation_Settings]
TotalStep = 100000
OutputStep = 1000
