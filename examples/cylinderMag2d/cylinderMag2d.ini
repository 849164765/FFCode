[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; square domain, paper Sec. III.A: L=256, R=L/10
Ni = 128
Nj = 128
Cell_Len = 1.0
BlockCellLen = 16
[Cylinder]
Radius = 12.8
CenterX = 64
CenterY = 64
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Magnetic_Field]
; outer fluid mu_l (mu1), cylinder mu_h (mu2); mu scaled x0.1 (ratio preserved,
; faster psi convergence). mu1/mu2 ratio is varied in the validation.
mu_l = 1.76
mu_h = 0.22
H0 = 0.05
PsiSolver_Iter = 100
PsiSolver_K = 0.5
[Simulation_Settings]
; total pseudo-time sub-iterations = SubSteps * PsiSolver_Iter
SubSteps = 40
