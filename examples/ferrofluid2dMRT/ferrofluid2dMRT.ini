[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 121
Nj = 241
Cell_Len = 1.0
BlockCellLen = 61
[Bubble]
Radius = 30
CenterX = 60
CenterY = 60
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
rho_l = 0.001
rho_h = 1.0
Eo = 125
Re = 35
U_g = 0.01
[Magnetic]
; === 无量纲化 (Hu & Li 2018, Phys. Rev. E 98, 033301 §B) ===
; 参考量: ρ_ref=800 kg/m³, L_ref=0.8 mm, U_ref=5 m/s
; μ = μ₀(1+χ), μ₀归一化=1
Mu_l = 1.0
Mu_h = 3.2
; χ: 线性磁化 (H ≪ Ms=40 kA/m)
Chi_l = 0.0
Chi_h = 2.2
; H₀: 外磁场 — Bom = μ₀χ₀H₀²R/σ
;   论文实验 vs 格单位换算:
;   H_phys(kA/m) | Bom   | H₀_LB    | 现象 (论文Fig.4)
;   -------------|-------|----------|------------------
;   1.2          | 1.3   | 0.0010   | 圆形(弱磁,表面张力主导)
;   2.4          | 5.2   | 0.0019   | 微椭圆
;   2.9          | 7.6   | 0.0023   | 椭圆
;   3.7          | 12.3  | 0.0030   | 明显拉长
;   5.5          | 27.2  | 0.0045   | 显著拉长 (b/a>>1)
H0 = 0.0023
[Simulation_Settings]
TotalStep = 5000
OutputStep = 100
