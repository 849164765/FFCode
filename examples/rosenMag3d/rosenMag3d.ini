[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; 网格必须能被 BlockCellLen 整除 (每方向块数 = 网格/块长)
; 非方形域: hex 种子 y 周期 = 2*lambda_c/sqrt(3) = 36.95 (lambda_c=32)。
;   Nj=111 -> 3.004 个 hex 行, 种子 y 接缝跳变仅 0.007 格 (vs Nj=128 -> 1.26 格)。
;   x 周期 = 2*lambda_c = 64, Nx=128 正好铺 2 个。
;   方形 128x128 无法铺满六角图案 -> 峰融合; Nj=111 近乎完美铺满。
Ni = 128
Nj = 111
Nk = 128
Cell_Len = 1.0
BlockCellLen = 32
[Layer]
; 铁磁流体层占据底部 1/3 (论文案例D: 溶剂 2/3 + 铁磁流体 1/3)
; 界面初始位置 (z 方向), 勿置于块边界上 (如 32/64/96)
InterfaceZ = 42.67
; 临界波长 lambda_c (格子单位), 重力 g = sigma/DeltaRho * (2pi/lambda_c)^2
; 理论: lambda_c=32 -> g=2.807e-4, H_c=0.1377
LambdaC = 32.0
; 初始界面扰动模式: square | hex | noise
;   square: 平方晶格 cos(2pi x/lc)+cos(2pi y/lc) (4重对称)。3D 中四方阵是亚稳构型,
;           非线性阶段会向六角重排(峰迁移/融合/波峰数减少) —— 观察到的粗化由此而来。
;   hex:    六角晶格, 3 个 60° 波矢平面波 (峰间距 2/sqrt(3)*lc ≈ 1.155 lc)。这是
;           3D Rosensweig 的天然平衡图案, 播种后应保持稳定规则阵列。
;   noise:  仅随机扰动 (振幅由 PerturbRand 控制), 自发起峰。
Perturb_Mode = hex
; 扰动振幅 A (格子单位): 峰值界面位移 ≈ A。A=0 且 H0>Hc 时由数值噪声自发起峰
PerturbAmp = 1.0
; 确定性随机扰动振幅 (格子单位), 打破图案对称性, 加速非线性选择
PerturbRand = 0.05
; 峰位相位默认 lc/2 (峰在域内部, 周期接缝 x=0/y=0 平面存在相场伪影)
PhaseX = 16.0
PhaseY = 16.0
[Phase_Field]
; 界面厚度 W=4 (论文值); 要求 W << lambda_c (W/lambda < 0.15 为宜)
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
; 论文案例D格子参数: rho_l=1 (溶剂), rho_h=1.975 (铁磁流体), sigma=0.0071
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071
; 重力由 LambdaC 自动推导; 如需覆盖可在此直接指定 (如 Gravity = 0 无重力验证)
; Gravity = 0.0
; 界面预压力项 F_p = -(p/3)*DeltaRho*grad(phi) (Zu&He 格式, 默认开启)
; PreForce = 1
[Magnetic_Field]
; 论文案例D第二组配置: chi=0.9 -> mu_h = 1+chi = 1.9
chi_l = 0.0
chi_h = 0.9
mu_l = 1.0
mu_h = 1.9
; 外加垂直均匀磁场 (格子单位): 理论 H_c = 0.1376
; H0=0.196 = 1.42*H_c (恢复用户修改前"少量融合@20000步"的有效场强: 旧 BC 的 +18.75%
;   场高估使旧 H0=0.165 实际有效约 1.42*H_c; 新 BC 无高估, 故直接取 0.196)。
; H0=0.2401=1.74*H_c (论文 Fig.20 的 8.2 kA/m 梳状结构) 实测六角种子仍会缓慢粗化
;   (缩放诊断: 12->10 峰, ~10000 步等价), 故生产默认取 1.42*H_c 避免融合。
; H0 = 0 时关闭磁力, 界面保持平坦 (对照组)
H0 = 0.196
; psi-solver: K=0.5 -> tau=0.5+0.5*mu, ~100 次子迭代收敛 (消除界面 |H| 网格级振荡)
PsiSolver_Iter = 100
PsiSolver_K = 0.5
; 特征时间 tau_visc = rho_h*lambda_c^2/eta_h ~ 7000 步, 峰值在 ~1e4-2e4 步内形成
[Simulation_Settings]
TotalStep = 40000
OutputStep = 1000
