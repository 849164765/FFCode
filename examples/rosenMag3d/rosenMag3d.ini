[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; 网格必须能被 BlockCellLen 整除 (每方向块数 = 网格/块长)
Ni = 128
Nj = 128
Nk = 128
Cell_Len = 1.0
BlockCellLen = 32
[Layer]
; 铁磁流体层占据底部 1/3 (论文案例D: 溶剂 2/3 + 铁磁流体 1/3)
; 界面初始位置 (z 方向), 勿置于块边界上 (如 32/64/96)
InterfaceZ = 42.67
; 临界波长 lambda_c (格子单位), 重力 g = sigma/DeltaRho * (2pi/lambda_c)^2
; 理论: lambda_c=32 -> g=2.807e-4, H_c=0.1377
LambdaC = 32.0
; 平方晶格种子扰动振幅 A: h(x,y)=z0 + (A/2)*[cos(2pi(x-Px)/lc)+cos(2pi(y-Py)/lc)]
; 峰位相位默认 lc/2 (峰在域内部, 周期接缝 x=0/y=0 平面存在相场伪影)
; A=0 且 H0>Hc 时由数值噪声自发起峰, 建议保留小值加速
PerturbAmp = 1.0
; 确定性随机扰动振幅 (格子单位), 打破 4 重对称性
PerturbRand = 0.05
PhaseX = 16.0
PhaseY = 16.0
[Phase_Field]
; 界面厚度 W=4 (论文值); 要求 W << lambda_c (W/lambda < 0.15 为宜)
Interface_Width = 4.0
Mobility = 0.01
[Two_Phase]
; 论文案例D格子参数: rho_l=1 (溶剂), rho_h=1.975 (铁磁流体), sigma=0.0071
rho_l = 1.0
rho_h = 1.975
eta_l = 0.0073
eta_h = 0.292
sigma = 0.0071
; 重力由 LambdaC 自动推导; 如需覆盖可在此直接指定 (如 Gravity = 0 无重力验证)
; Gravity = 0.0
; 界面预压力项 F_p = -(p/3)*DeltaRho*grad(phi) (Zu&He 格式, 默认开启)
; PreForce = 1
[Magnetic_Field]
; 论文案例D第二组配置: chi=0.9 -> mu_h = 1+chi = 1.9
chi_l = 0.0
chi_h = 0.9
mu_l = 1.0
mu_h = 1.9
; 外加垂直均匀磁场 (格子单位): 理论 H_c = 0.1376, 取 H0 = 1.2*H_c
; H0 = 0 时关闭磁力, 界面保持平坦 (对照组)
H0 = 0.165
; psi-solver: K=0.5 -> tau=0.5+0.5*mu, ~100 次子迭代收敛 (消除界面 |H| 网格级振荡)
PsiSolver_Iter = 100
PsiSolver_K = 0.5
; 特征时间 tau_visc = rho_h*lambda_c^2/eta_h ~ 7000 步, 峰值在 ~1e4-2e4 步内形成
[Simulation_Settings]
TotalStep = 40000
OutputStep = 1000
