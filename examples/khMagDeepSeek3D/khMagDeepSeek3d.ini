[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
; 方案B: L=128 -> 域 x∈[0,2L]=256, y∈[0,L]=32(挤出方向, 可调16~64), z∈[0,4L]=512
; x/y 周期, z 壁; 网格必须能被 BlockCellLen 整除
Ni = 256
Nj = 32
Nk = 512
Cell_Len = 1.0
BlockCellLen = 32
[Interface]
; 界面 z0 = 2L, 扰动只沿 x: h(x) = z0 - A*cos(2πx/L) (文献相位), A=0.1L=12.8, 2 个周期跨域宽
Z0_cells = 256
PerturbAmp_cells = 12.8
PerturbPeriods = 2
[Phase_Field]
; 界面厚度 W (论文 F 节; 方案B λ=128, W/λ=4/128=0.031, 接近论文 W/λ≈0.016)
Interface_Width = 4
Mobility = 0.01
[Two_Phase]
; 论文 F 节无量纲数: U0=0.02, Re=5000, We=10000, Fr=1.
; 标准 KH 基准: 重流体(铁磁流体, φ=1)在下 rho_h=1.0, 轻流体(溶剂, φ=0)
; 在上 rho_l=0.99; Re/We 用上侧溶剂密度定义.
Re = 5000
We = 10000
Fr = 1
U0 = 0.02
rho_l = 0.99
rho_h = 1.0
; 下相铁磁流体粘度默认 = eta_l (文献未单独给出; 可显式覆盖)
; eta_h = 0.004
; 注: Re=5000 在低 L 分辨率下 omega 接近 LBM 稳定上限; 代码默认把
;     eta_l 钳到 omega=1.98 (有效 Re~760), 以复现文献时间轴。
;     如需严格 Re=5000, 请显式给 eta_l=0.00025344, 但时间轴会偏快。
; 界面预压力项 F_p = -(p/3)*DeltaRho*grad(phi) (默认开启)
PreForce = 1
; 显式覆盖 (可选): 给出则优先于无量纲推导
; eta_l = 0.00025344
; sigma = 2.5344e-6
; Gravity = 6.25e-6
[Magnetic_Field]
; 铁磁流体(φ=1, 在下): chi_h=1.0 -> mu_h=2.0 (与2D一致); 溶剂(φ=0) chi_l=0
chi_l = 0.0
chi_h = 1.0
mu_l = 1.0
mu_h = 2.0
; 磁 Bond 数 Bo_m = mu0*H0^2*L/(2*sigma) (mu0=1), H0 = sqrt(2*sigma*Bo_m/L)
; 论文 F 节取值: 0 / 636 / 1434 / 2547 / 3980
Bo_m = 2547
; 显式 H0 覆盖 (可选): 给出则优先
; H0 = 0.01427
; psi-solver: 解析磁势初值 + 有限差分 Gauss-Seidel 求解
; nabla.(mu nabla psi)=0。3D 实测: 子迭代需到 50 才与 100 基本一致, 取 50 以省时间。
; 不使用 D3Q7 MRT 伪时间迭代: 它在水平场扭曲周期缝上会积累出
; 反号的 delta_psi (Hx 反号), 这是旧案例磁力偏小的数值根源。
PsiSolver_Iter = 50
PsiSolver_K = 2.0
[Simulation_Settings]
; KH 磁压力项: MagPressure=1 开启; MagPressure_Factor 越大磁力越强
; 3D 实测: 1.5仍有卷曲, 2.0明显减弱但仍略卷, 现提到 2.2 (若仍不够可试 2.5, 别超 3.0)
; 3D 现与 2D 一致使用 chi_h=1.0/mu_h=2.0 (dmu=1.0)
MagPressure = 1
MagPressure_Factor = 1.8
; 论文图像校准: t*_plot = 4*t*_eq = 4*step*sqrt(g/L_ref) = 4*step*U0/L_ref
; (与 2D 的 KH_TSTAR_SCALE=4 一致)
; L_ref=128, U0=0.02 -> t*=step/1600
; t*=2 约 step=3200, t*=4 约 step=6400, t*=6 约 step=9600, t*=8 约 step=12800
TotalStep = 10000
OutputStep = 500
