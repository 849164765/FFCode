[workdir]
workdir_ = ./
[parallel]
thread_num = 1
[Mesh]
Ni = 128
Nj = 512
Cell_Len = 1.0
BlockCellLen = 64
[Bubble]
Radius = 20
CenterX = 64
CenterY = 64
[Phase_Field]
Interface_Width = 4.0
Mobility = 0.1
[Two_Phase]
rho_l = 1.0
rho_h = 2.0
Eo = 20
Re = 5
U_g = 0.1
[Magnetic_Field]
# Permeability: mu_l = ferrofluid, mu_h = non-magnetic fluid (air/bubble interior)
# mu = mu_0*(1+chi), in lattice units mu_0 is absorbed (set mu_h=1 as reference)
mu_l = 3.0
mu_h = 1.0
# Magnetic susceptibility: chi_l = ferrofluid, chi_h = 0 (bubble interior non-magnetic)
chi_l = 2.0
chi_h = 0.0
# Applied uniform magnetic field (lattice units)
# Bo_m = chi_l * H0^2 / sigma, sigma=0.02
# H0=0    -> Bo_m=0    (no field, should match non-magnetic bubble2d)
# H0=0.10 -> Bo_m=1.0
# H0=0.14 -> Bo_m=2.0  (current setting)
# H0=0.17 -> Bo_m=3.0
# H0=0.20 -> Bo_m=4.0
H0_x = 0.0
H0_y = 0.14
# MF pseudo-time sub-iterations per NS step
mf_substeps = 100
# Pseudo-time relaxation parameter (dimensionless, paper Eq.37: epsilon=1/mu0)
epsilon = 1.0
[Simulation_Settings]
TotalStep = 500
OutputStep = 10
